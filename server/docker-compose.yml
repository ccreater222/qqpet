name: qqpet-sync

services:
  qqpet-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      QQPET_SYNC_BIND: 0.0.0.0
      QQPET_SYNC_PORT: 8787
      QQPET_SYNC_DB: /var/lib/qqpet-sync/qqpet.sqlite
      QQPET_SYNC_BACKUP_DIR: /var/lib/qqpet-sync/backups
      QQPET_SYNC_RESTORE_GENERATION_FILE: /var/lib/qqpet-sync/restore-generation.txt
      QQPET_OWNER_ADMIN_CREDENTIAL: /run/qqpet-secrets/owner_admin_credential
      QQPET_OWNER_ADMIN_CREDENTIAL_SOURCE: /run/secrets/owner_admin_credential
      QQPET_SYNC_TIME_ZONE: ${QQPET_SYNC_TIME_ZONE:-Asia/Shanghai}
      QQPET_SYNC_WEATHER_LOCATION: ${QQPET_SYNC_WEATHER_LOCATION:-北京}
      QQPET_SYNC_CLIENT_DATA_DIR: /var/lib/qqpet-sync/client-data
      QQPET_SYNC_WEATHER_UPSTREAM: ${QQPET_SYNC_WEATHER_UPSTREAM:-https://wttr.in}
      QQPET_SYNC_WEATHER_TIMEOUT_MS: ${QQPET_SYNC_WEATHER_TIMEOUT_MS:-10000}
      QQPET_SYNC_WEATHER_CACHE_MS: ${QQPET_SYNC_WEATHER_CACHE_MS:-600000}
      QQPET_SYNC_ADVANCE_WHILE_EMPTY: ${QQPET_SYNC_ADVANCE_WHILE_EMPTY:-1}
      QQPET_SYNC_CATCHUP_CHUNK_TICKS: ${QQPET_SYNC_CATCHUP_CHUNK_TICKS:-1440}
      QQPET_SYNC_LOG_LEVEL: ${QQPET_SYNC_LOG_LEVEL:-info}
    # Compose validates env_file paths at config/up time. The owner credential
    # is a bare token (no KEY= prefix), so Compose ignores it as an assignment;
    # this entry exists to make a missing credential path fail closed. The
    # actual secret is declared below and mounted by the Compose secret store.
    env_file:
      - ${QQPET_OWNER_ADMIN_CREDENTIAL_FILE:?QQPET_OWNER_ADMIN_CREDENTIAL_FILE is required and must point to a 0600 owner credential file}
    # File secrets retain the host owner/mode on bind-backed engines. Start the
    # entrypoint as root only long enough to copy this one secret into a
    # node-owned tmpfs, then exec the server as the non-root node user.
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/qqpet-docker-entrypoint.sh"]
    command: ["start"]
    secrets:
      - source: owner_admin_credential
        target: owner_admin_credential
    volumes:
      - qqpet-data:/var/lib/qqpet-sync
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
      - /run/qqpet-secrets:size=64k,mode=0700,noexec,nosuid
    # Keep the authority port off the public interface. Caddy is the only
    # public TLS/WebSocket ingress.
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => { if (r.ok === false) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      qqpet-sync:
        condition: service_healthy
    environment:
      QQPET_DOMAIN: ${QQPET_DOMAIN:-pet.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  qqpet-data:
  caddy-data:
  caddy-config:

secrets:
  owner_admin_credential:
    file: ${QQPET_OWNER_ADMIN_CREDENTIAL_FILE:?QQPET_OWNER_ADMIN_CREDENTIAL_FILE is required and must point to a 0600 owner credential file}
