name: Docs gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs checker and commit-range gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The docs checker and its tests are dependency-free; no npm ci needed.
      - run: npm run test:docs
      - run: npm run check:docs
      - run: npm run check:docs:range
